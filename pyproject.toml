[project]
name = "solana-gym"
version = "0.1.0"
description = "Solana Bench: sandbox environments for measuring LLM transaction-building skill"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.0.15",
    "javascript>=1!1.2.2",
    "langchain>=0.3.26",
    "langchain-anthropic>=0.3.17",
    "langchain-openai>=0.3.28",
    "openai>=1.93.0",
    "seaborn>=0.13.2",
    "setuptools>=80.9.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
